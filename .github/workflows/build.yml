name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Use the newest Xcode on the runner
        run: |
          XCODE="$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version
          swift --version

      - name: Translations are complete
        run: |
          python3 scripts/check-localizations.py
          plutil -lint Resources/Info.plist Resources/*.lproj/Localizable.strings

      - name: Build the app bundle (ad-hoc signed, arm64)
        run: SIGN_IDENTITY=- ARCHS=arm64 ./build.sh

      - name: The bundle is complete
        run: |
          test -x build/HideBar.app/Contents/MacOS/HideBar
          test -d build/HideBar.app/Contents/Frameworks/Sparkle.framework
          codesign --verify --strict --deep build/HideBar.app
