name: Bug report
description: Something in HideBar doesn't work as it should.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what HideBar did instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Click «
        2. …
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: In HideBar's Settings, press **Copy Diagnostics** at the bottom and paste here. It holds versions, display and menu bar geometry and recent HideBar log lines, nothing personal.
      render: text
    validations:
      required: true
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots or a screen recording
      description: A picture of the menu bar helps a lot with layout problems.
